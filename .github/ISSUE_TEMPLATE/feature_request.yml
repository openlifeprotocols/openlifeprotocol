name: Feature request
description: Propose a new capability for protocol, tooling, docs, or app.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: problem
    attributes:
      label: Problem statement
      description: What user/system problem does this solve?
      placeholder: Current reasoning rules cannot ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change and expected behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated.
  - type: textarea
    id: impact
    attributes:
      label: Impact and risks
      description: Backward compatibility, governance, performance, or migration considerations.
