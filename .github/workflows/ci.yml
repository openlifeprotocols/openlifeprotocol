name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Using npm ci (lockfile found)"
            npm ci
          else
            echo "package-lock.json not found; falling back to npm install"
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Validate registry
        run: npm run registry:validate

      - name: Schema quality audit
        run: npm run schemas:audit

      - name: Semantic coverage audit
        run: npm run schemas:semantic

      - name: Automated tests
        run: npm test

      - name: Benchmark/perf validation
        run: npm run benchmark

      - name: Build app
        run: npm run build
