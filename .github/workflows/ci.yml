name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate registry
        run: npm run registry:validate

      - name: Schema quality audit
        run: npm run schemas:audit

      - name: Semantic coverage audit
        run: npm run schemas:semantic

      - name: Automated tests
        run: npm test

      - name: Benchmark/perf validation
        run: npm run benchmark

      - name: Build app
        run: npm run build
